services:
  router-proxy:
    image: nginx:alpine
    container_name: router-proxy
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      LETSENCRYPT_HOST: ${VIRTUAL_HOST}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nginx-reverse-proxy

networks:
  nginx-reverse-proxy:
    external: true